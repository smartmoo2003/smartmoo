<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartMoo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 1.5rem;
    }

    .container {
      max-width: 600px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .tagline {
      font-size: 1.15rem;
      color: #94a3b8;
      font-weight: 400;
      margin-bottom: 2rem;
    }

    .divider {
      width: 48px;
      height: 2px;
      background-color: #334155;
      margin: 0 auto 1.5rem auto;
    }

    .partners {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 0.35rem;
    }

    .year {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #64748b;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>SmartMoo</h1>
    <p class="tagline">Gestão e Tecnologia para a Pecuária</p>
    
    <div class="divider"></div>

    <p class="partners"><strong>Sócios:</strong> Miguel Oliveira | Victor Baretta</p>
    <p class="year">Since 2026</p>
  </main>

</body>
</html>
